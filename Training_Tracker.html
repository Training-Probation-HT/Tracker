<style>

  .tt-sumcard{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .tt-sumnum{ font-family:'Fraunces',serif; font-size:26px; font-weight:700; color:var(--teal); }
  .tt-sumlabel{ font-size:11px; color:var(--sage); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .tt-toast{

    align-items:flex-start;

</style>

function bindPasswordToggles(){
  document.querySelectorAll('.tt-pw-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const inp = document.getElementById(btn.dataset.target);
      if(!inp) return;
      const showing = inp.type === 'text';
      inp.type = showing ? 'password' : 'text';
      btn.innerHTML = showing ? EYE_ICON : EYE_OFF_ICON;
    });
  });
}

// ---------- SYNC KE GOOGLE SHEET ----------
// Tempel URL Web App hasil deploy Google Apps Script di sini (lihat panduan setup).
// Contoh: "https://script.google.com/macros/s/AKfycb.../exec"
const TRACKER_API_URL = "https://script.google.com/macros/s/AKfycbzDn8gs1DxjE99NkF0k4XlwEVe9hU129pjeK8WdLtGP7V0VLy6ap82y5a6nMuvnpaHV/exec";

function postToSheet(payload){
  if(!TRACKER_API_URL) return;
  try{
    fetch(TRACKER_API_URL, {
      method: 'POST',
      mode: 'no-cors', // fire-and-forget untuk log audit, tidak perlu baca respons
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).catch(function(err){ console.error('Sync log ke Google Sheet gagal:', err); });
  }catch(err){ console.error('Sync log ke Google Sheet gagal:', err); }
}

// ---------- KV STORE (baca/tulis data utama dari Google Sheet) ----------
async function kvFetchAll(){
  const res = await fetch(TRACKER_API_URL);
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Gagal memuat data');
  return { data: json.data || {}, elearning: json.elearning || {} };
}

async function kvSet(key, value){
  const res = await fetch(TRACKER_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ type: 'kv_set', key: key, value: value })
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Gagal menyimpan data');
  return json;
}

// Upload foto ke Google Drive lewat Apps Script, balikin URL pendek (bukan base64 mentah)
// supaya tidak melebihi batas 50.000 karakter per sel Google Sheet.
async function uploadFotoToServer(dataUrl, employeeName, bulan){
  const res = await fetch(TRACKER_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ type: 'upload_foto', dataUrl: dataUrl, employeeName: employeeName, bulan: bulan })
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Gagal upload foto');
  return json.url;
}

// ---------- STORAGE ----------
async function loadAll(){
  let kvData = {};
  state.elearning = {};
  try{
    const fetched = await kvFetchAll();
    kvData = fetched.data;
    state.elearning = fetched.elearning;
  }catch(e){
    console.error('Gagal memuat data dari server:', e);
    state.loadError = true;
  }

  try{
    const cfgRaw = kvData['checklist_config'];
    state.depts = cfgRaw ? JSON.parse(cfgRaw) : null;
  }catch(e){ state.depts = null; }
  if(!state.depts){
    // pertama kali dibuka: pakai bawaan, hitung nextNo per departemen, lalu simpan
    state.depts = JSON.parse(JSON.stringify(DEFAULT_DEPTS));
    Object.keys(state.depts).forEach(k=>{
      const maxNo = state.depts[k].items.reduce((m,it)=>Math.max(m,it.no),0);
      state.depts[k].nextNo = maxNo + 1;
    });
    await saveDepts();
  }
  try{
    const empRaw = kvData['employees'];
    state.employees = empRaw ? JSON.parse(empRaw) : [];
  }catch(e){ state.employees = []; }

  try{
    const laRaw = kvData['leader_accounts'];
    state.leaderAccounts = laRaw ? JSON.parse(laRaw) : [];
  }catch(e){ state.leaderAccounts = []; }

  try{
    const vaAccRaw = kvData['validator_accounts'];
    state.validatorAccounts = vaAccRaw ? JSON.parse(vaAccRaw) : [];
  }catch(e){ state.validatorAccounts = []; }

  // cek sesi login tersimpan di perangkat ini; validasi ulang ke daftar akun
  // (kalau akunnya sudah dihapus admin, sesi lama otomatis tidak berlaku)
  try{
    const savedEmail = localStorage.getItem('tt_session_email');
    const savedRole = localStorage.getItem('tt_session_role') || 'leader';
    if(savedEmail){
      const pool = savedRole === 'validator' ? state.validatorAccounts : state.leaderAccounts;
      const acc = pool.find(a=>a.email.toLowerCase()===savedEmail.toLowerCase());
      if(acc){
        state.session = { email: acc.email, name: acc.name, role: savedRole };
        if(savedRole === 'leader') state.leaderName = acc.name;
      } else {
        localStorage.removeItem('tt_session_email');
        localStorage.removeItem('tt_session_role');
      }
    }
  }catch(e){ /* abaikan */ }

  try{
    const otRaw = kvData['outlets_list'];
    state.outlets = otRaw ? JSON.parse(otRaw) : [];
  }catch(e){ state.outlets = []; }
  try{
    const pinRaw = kvData['admin_pin'];
    if(pinRaw){ state.adminPin = String(pinRaw); }
    else{ await saveAdminPin(); }
  }catch(e){ /* pakai default */ }
  try{
    const pdRaw = kvData['panduan_text'];
    state.panduanText = pdRaw || "Panduan belum diisi oleh Admin.";
  }catch(e){ state.panduanText = "Panduan belum diisi oleh Admin."; }

  // progress semua karyawan sudah ikut terbawa dalam satu kali fetch di atas
  state.progress = {};
  Object.keys(kvData).forEach(k=>{
    if(k.indexOf('progress_')===0){
      const empId = k.substring('progress_'.length);
      try{ state.progress[empId] = JSON.parse(kvData[k]); }catch(e){ state.progress[empId] = {}; }
    }
  });

  state.loaded = true;
  render();
  if(state.loadError) showToast('Gagal memuat data. Cek koneksi internet.');
}

// ---------- AUTH HELPERS ----------
// Password di-hash (SHA-256) sebelum dikirim/disimpan. Ini bukan tingkat keamanan
// perbankan (tidak ada salt per-user, tidak ada verifikasi email), tapi cukup untuk
// mencegah password leader/validator kebaca polos di Google Sheet.
async function hashPassword(password){
  const text = String(password);
  if(window.crypto && window.crypto.subtle){
    const enc = new TextEncoder().encode(text);
    const buf = await window.crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  // fallback sangat sederhana kalau browser tidak mendukung crypto.subtle
  // (misalnya dibuka lewat http:// non-localhost) — tetap lebih baik dari plaintext.
  let h = 0;
  for(let i=0;i<text.length;i++){ h = ((h<<5)-h+text.charCodeAt(i))|0; }
  return 'fallback_'+Math.abs(h).toString(16);
}

function esc(s){ return (s||"").replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// Kompres & resize foto sebelum disimpan, supaya ukurannya kecil (hemat kuota & kirim ke Drive)
function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 1280;
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else{ w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = ()=>reject(new Error('Gagal memuat gambar'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('Gagal membaca file'));
    reader.readAsDataURL(file);
  });
}

function deptItemsFor(deptKey){ return state.depts[deptKey] ? state.depts[deptKey].items : []; }

function computeStats(empId, deptKey){
  const items = deptItemsFor(deptKey);
  const prog = state.progress[empId] || {};
  const byBulan = {1:{done:0,total:0},2:{done:0,total:0},3:{done:0,total:0}};
  let finalStatus = null;
  items.forEach(it=>{
    if(it.final){
      const v = prog['item_'+it.no];
      finalStatus = v && v.status ? v.status : null;
      return;
    }
    byBulan[it.bulan].total++;
    const v = prog['item_'+it.no];
    if(v && v.status === 'Sudah Dikuasai') byBulan[it.bulan].done++;
  });
  const totalAll = byBulan[1].total+byBulan[2].total+byBulan[3].total;
  const doneAll = byBulan[1].done+byBulan[2].done+byBulan[3].done;
  return { byBulan, overallPct: totalAll ? Math.round(doneAll/totalAll*100) : 0, finalStatus };
}

// Verdict validasi keseluruhan (semua bulan digabung) untuk 1 karyawan, dipakai di Dashboard.
// Valid = semua poin yang sudah "Sudah Dikuasai" juga sudah dinilai Valid (gak ada yang belum dinilai/Tidak Valid).
// Tidak Valid = semua poin yang sudah "Sudah Dikuasai" dinilai Tidak Valid.
// Proses Validasi = campuran, ada yang belum dinilai, atau belum ada poin yang eligible sama sekali.
function computeValidasiVerdict(empId, deptKey){
  const items = deptItemsFor(deptKey).filter(it=>!it.final);
  const prog = state.progress[empId] || {};
  const eligible = items.filter(it=>(prog['item_'+it.no]||{}).status === 'Sudah Dikuasai');
  if(eligible.length === 0) return 'Proses Validasi';
  let validCount=0, invalidCount=0, unratedCount=0;
  eligible.forEach(it=>{
    const vi = prog['val_item_'+it.no];
    if(vi && vi.valid==='Valid') validCount++;
    else if(vi && vi.valid==='Tidak Valid') invalidCount++;
    else unratedCount++;
  });
  if(unratedCount===0 && invalidCount===0 && validCount>0) return 'Valid';
  if(unratedCount===0 && validCount===0 && invalidCount>0) return 'Tidak Valid';
  return 'Proses Validasi';
}

function isBulanComplete(stats, bulan){
  const bs = stats.byBulan[bulan];
  return bs.total > 0 && bs.done === bs.total;
}

// ---------- LULUS PROBATION (gabungan E-Learning + Tracker) ----------
// Nama dinormalisasi (trim + huruf kecil + spasi dirapikan) biar "Nisa"/"nisa" ketemu.
// Typo beda ejaan (mis. "Fathiya" vs "Fathiyaa") TETAP tidak ketemu — itu perlu
// dibenarkan manual supaya salah satu sisi datanya konsisten.
function normalizeNama(s){
  return String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
}

function getTeoriInfo(empName){
  const info = state.elearning[normalizeNama(empName)];
  return info || null; // null = data e-learning karyawan ini tidak ditemukan
}

// Bulan dianggap "lulus praktik" (dapat bobot 33.33%) HANYA kalau ketiganya terpenuhi:
// 1) semua poin non-final di bulan itu sudah "Sudah Dikuasai" oleh leader
// 2) validator sudah submit validasi bulan itu
// 3) SEMUA poin yang dinilai validator berstatus "Valid" (tidak ada yang "Tidak Valid"/belum dinilai)
function praktikBulanLulus(empId, deptKey, bulan){
  const items = deptItemsFor(deptKey).filter(it=>it.bulan===bulan && !it.final);
  if(items.length === 0) return false;
  const prog = state.progress[empId] || {};
  const allDone = items.every(it=>(prog['item_'+it.no]||{}).status === 'Sudah Dikuasai');
  if(!allDone) return false;
  const vv = prog['validasi_bulan'+bulan] || {};
  if(!vv.submitted) return false;
  return items.every(it=>{
    const vi = prog['val_item_'+it.no];
    return vi && vi.valid === 'Valid';
  });
}

function computePraktikPct(empId, deptKey){
  let lulusCount = 0;
  [1,2,3].forEach(b=>{ if(praktikBulanLulus(empId, deptKey, b)) lulusCount++; });
  return Math.round((lulusCount/3)*100);
}

// Deadline probation = tanggal mulai kerja + 3 bulan + 1 minggu.
function calcProbationDeadline(startDateStr){
  if(!startDateStr) return null;
  const d = new Date(startDateStr+'T00:00:00');
  if(isNaN(d.getTime())) return null;
  d.setMonth(d.getMonth()+3);
  d.setDate(d.getDate()+7);
  return d;
}

// Status akhir probation, gabungan teori (e-learning) + praktik (Tracker) + deadline.
// Pilihan manual "Kesimpulan Akhir" leader TIDAK dipakai lagi untuk menentukan ini —
// murni otomatis dari data.
function computeProbationStatus(emp){
  const teori = getTeoriInfo(emp.name);
  if(!teori){
    return { kind:'warn', label:'Data e-learning tidak ditemukan', teoriPct:null, praktikPct: computePraktikPct(emp.id, emp.department) };
  }
  const praktikPct = computePraktikPct(emp.id, emp.department);
  const teoriPct = teori.pct;

  if(teoriPct === 100 && praktikPct === 100){
    return { kind:'lulus', label:'Lulus Probation', teoriPct, praktikPct };
  }

  const deadline = calcProbationDeadline(emp.startDate);
  const lewatDeadline = deadline ? (new Date() > deadline) : false;

  if(lewatDeadline){
    return { kind:'tidak', label:'Tidak Lulus', teoriPct, praktikPct };
  }
  return { kind:'proses', label:'Proses Belajar', teoriPct, praktikPct };
}
function isBulanSubmitted(prog, bulan){
  const s = prog['submit_bulan'+bulan];
  return !!(s && s.submitted);
}
function isBulanLocked(prog, bulan){
  if(bulan <= 1) return false;
  return !isBulanSubmitted(prog, bulan-1);
}

function outletList(){
  const s = new Set(state.employees.map(e=>e.outlet).filter(Boolean));
  return Array.from(s);
}

function currentStageLabel(st){
  if(st.finalStatus) return st.finalStatus;
  for(const b of [1,2,3]){
    const bs = st.byBulan[b];
    if(bs.total>0 && bs.done < bs.total) return `Bulan ${b} — ${BULAN_TITLE[b]}`;
  }
  return 'Menunggu Kesimpulan Akhir';
}

// ---------- AUTH SCREEN (LOGIN / SIGNUP) ----------
function renderAuth(){
  const isSignup = state.authView === 'signup';
  const role = state.authRole; // 'leader' | 'validator'
  const roleLabel = role === 'validator' ? 'Validator' : 'Leader';

  let html = `<div class="tt-card">
    <span class="tt-label">Masuk sebagai</span>
    <div class="tt-dept-grid" style="margin-top:6px; margin-bottom:14px;">
      <div class="tt-dept-btn ${role==='leader'?'active':''}" data-authrole="leader">Leader</div>
      <div class="tt-dept-btn ${role==='validator'?'active':''}" data-authrole="validator">Validator</div>
    </div>

    <div style="font-weight:700; font-size:16px; font-family:'Fraunces',serif; color:var(--teal); margin-bottom:2px;">${isSignup?('Daftar Akun '+roleLabel):('Masuk sebagai '+roleLabel)}</div>
    <div style="font-size:12.5px; color:var(--sage); margin-bottom:14px;">${isSignup?'Buat akun sekali, dipakai untuk login setiap kali buka halaman ini.':'Masukkan email & password akun kamu.'}</div>`;

  if(state.authError){
    html += `<div style="font-size:12px; color:var(--terracotta); font-weight:600; margin-bottom:10px;">${esc(state.authError)}</div>`;
  }

  if(isSignup){
    html += `
      <div class="tt-field"><span class="tt-label">Nama Lengkap</span><input type="text" id="authName" class="tt-input" placeholder="Nama sesuai KTP/absensi" value="${esc(state.authDraftName)}"></div>
      <div class="tt-field"><span class="tt-label">Email</span><input type="text" id="authEmail" class="tt-input" placeholder="nama@email.com" value="${esc(state.authDraftEmail)}"></div>
      ${passwordFieldHtml('authPassword', 'Password', 'Minimal 6 karakter')}
      ${passwordFieldHtml('authPassword2', 'Ulangi Password', 'Ulangi password')}
      <button class="tt-btn tt-btn-primary" id="authSubmitBtn" style="width:100%;">Daftar</button>
      <div style="text-align:center; margin-top:12px; font-size:12.5px;">Sudah punya akun? <a href="#" id="authSwitch" style="color:var(--teal); font-weight:600;">Masuk di sini</a></div>`;
  } else {
    html += `
      <div class="tt-field"><span class="tt-label">Email</span><input type="text" id="authEmail" class="tt-input" placeholder="nama@email.com" value="${esc(state.authDraftEmail)}"></div>
      ${passwordFieldHtml('authPassword', 'Password', 'Password')}
      <button class="tt-btn tt-btn-primary" id="authSubmitBtn" style="width:100%;">Masuk</button>
      <div style="text-align:center; margin-top:12px; font-size:12.5px;">Belum punya akun? <a href="#" id="authSwitch" style="color:var(--teal); font-weight:600;">Daftar di sini</a></div>`;
  }
  html += `</div>`;

  root.innerHTML = html;
  bindPasswordToggles();

  document.querySelectorAll('[data-authrole]').forEach(b=>{
    b.addEventListener('click', ()=>{
      state.authRole = b.dataset.authrole;
      state.authError = '';
      renderAuth();
    });
  });

  document.getElementById('authSwitch').addEventListener('click', (e)=>{
    e.preventDefault();
    state.authView = isSignup ? 'login' : 'signup';
    state.authError = '';
    renderAuth();
  });

  document.getElementById('authSubmitBtn').addEventListener('click', async ()=>{
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const btn = document.getElementById('authSubmitBtn');

    // simpan draft supaya kalau gagal (misal salah password), email/nama tidak ikut hilang
    state.authDraftEmail = email;
    if(isSignup) state.authDraftName = document.getElementById('authName').value.trim();

    if(!email || !isValidEmail(email)){ state.authError = 'Email tidak valid.'; renderAuth(); return; }
    if(!password){ state.authError = 'Password wajib diisi.'; renderAuth(); return; }

    if(isSignup){
      const name = document.getElementById('authName').value.trim();
      const password2 = document.getElementById('authPassword2').value;
      if(!name){ state.authError = 'Nama wajib diisi.'; renderAuth(); return; }
      if(password.length < 6){ state.authError = 'Password minimal 6 karakter.'; renderAuth(); return; }
      if(password !== password2){ state.authError = 'Password & ulangi password tidak sama.'; renderAuth(); return; }
      if(findAccountByEmail(email, role)){ state.authError = 'Email ini sudah terdaftar sebagai '+roleLabel+'. Coba masuk (login).'; renderAuth(); return; }

      btn.disabled = true; btn.textContent = 'Mendaftarkan...';
      try{
        const passwordHash = await hashPassword(password);
        const acc = { email, name, passwordHash, createdAt: new Date().toISOString() };
        if(role === 'validator'){ state.validatorAccounts.push(acc); await saveValidatorAccounts(); }
        else { state.leaderAccounts.push(acc); await saveLeaderAccounts(); }
        setSession(acc, role);
        state.authError = '';
        render();
      }catch(e){
        console.error(e);
        state.authError = 'Gagal mendaftar. Cek koneksi internet & coba lagi.';
        renderAuth();
      }
    } else {
      btn.disabled = true; btn.textContent = 'Memeriksa...';
      try{
        const acc = findAccountByEmail(email, role);
        if(!acc){
          state.authError = 'Anda belum memiliki akun '+roleLabel+'. Klik "Daftar di sini" di bawah untuk mendaftar.';
          renderAuth();
          return;
        }
        const passwordHash = await hashPassword(password);
        if(acc.passwordHash !== passwordHash){
          state.authError = 'Email atau password salah.';
          renderAuth();
          return;
        }
        setSession(acc, role);
        state.authError = '';
        render();
      }catch(e){
        console.error(e);
        state.authError = 'Gagal login. Cek koneksi internet & coba lagi.';
        renderAuth();
      }
    }
  });
}

function downloadFile(filename, content, mimeType){
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function todayStamp(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

async function exportBackupJson(){
  for(const e of state.employees){ await loadProgress(e.id); }
  const backup = {
    exportedAt: new Date().toISOString(),
    depts: state.depts,
    employees: state.employees,
    progress: state.progress,
    leaderAccounts: state.leaderAccounts.map(a=>({email:a.email, name:a.name, createdAt:a.createdAt})), // passwordHash sengaja tidak diikutkan di backup
    outlets: state.outlets,
    validatorAccounts: state.validatorAccounts.map(a=>({email:a.email, name:a.name, createdAt:a.createdAt})),
    panduanText: state.panduanText
  };
  downloadFile('training-tracker-backup-'+todayStamp()+'.json', JSON.stringify(backup, null, 2), 'application/json');
}

function csvEscape(v){
  const s = String(v==null?'':v);
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}

async function exportSummaryCsv(){
  for(const e of state.employees){ await loadProgress(e.id); }
  const header = ['Nama Karyawan','Outlet','Departemen','Tanggal Mulai','Bulan 1 (%)','Bulan 2 (%)','Bulan 3 (%)','Total (%)','Status Akhir'];
  const rows = state.employees.map(e=>{
    const st = computeStats(e.id, e.department);
    const pct = (b)=> st.byBulan[b].total ? Math.round(st.byBulan[b].done/st.byBulan[b].total*100) : 0;
    return [
      e.name, e.outlet, e.department, e.startDate||'',
      pct(1), pct(2), pct(3), st.overallPct,
      statusLabel(st.finalStatus) || 'Masih Berjalan'
    ];
  });
  const csv = [header, ...rows].map(r=>r.map(csvEscape).join(',')).join('\n');
  downloadFile('training-tracker-ringkasan-'+todayStamp()+'.csv', '\uFEFF'+csv, 'text/csv;charset=utf-8');
}

function renderChecklist(){
  const area = document.getElementById('checklistArea');
  if(!area) return;
  const emp = state.employees.find(e=>e.id===state.currentEmployeeId);
  if(!emp){ area.innerHTML=''; return; }
  const items = deptItemsFor(state.dept);
  const stats = computeStats(emp.id, state.dept);
  const prog = state.progress[emp.id] || {};

  let html = `<div class="tt-card">
    <span class="tt-label">Sedang mengisi checklist</span>
    <div style="font-weight:700; font-size:16px; font-family:'Fraunces',serif; color:var(--teal)">${esc(emp.name)} &middot; ${state.depts[state.dept].label}</div>

  </div>`;

  [1,2,3].forEach(bulan=>{
    const bulanItems = items.filter(it=>it.bulan===bulan);
    const bs = stats.byBulan[bulan];
    const pct = bs.total ? Math.round(bs.done/bs.total*100) : 0;
    const locked = isBulanLocked(prog, bulan);
    const submitted = isBulanSubmitted(prog, bulan);
    const open = locked ? false : state.openBulan[bulan];
    const subInfo = prog['submit_bulan'+bulan] || {};

    html += `<div class="tt-card tt-bulan-block">
      <div class="tt-bulan-head" data-bulan="${bulan}" data-locked="${locked?'1':'0'}" style="${locked?'opacity:.55; cursor:not-allowed;':''}">
        <div class="tt-bulan-head-top">
          <svg class="tt-bulan-num tt-chevron ${open?'open':''}" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div class="tt-bulan-title">Bulan ${bulan} — ${BULAN_TITLE[bulan]}${locked?' 🔒':(submitted?' ✓':'')}</div>
          ${locked?'':`<div class="tt-bulan-pct">${bs.done}/${bs.total}</div>`}
        </div>
        ${locked
          ? `<div style="font-size:12px; color:var(--sage); padding-left:23px;">Selesaikan &amp; submit Bulan ${bulan-1} dulu</div>`
          : `<div class="tt-bulan-progress-track"><div class="tt-bulan-progress-fill" style="width:${pct}%"></div></div>`}
      </div>`;

    if(locked){
      html += `</div>`;

    }

    html += `<div class="tt-bulan-content" style="display:${open?'block':'none'}">`;

    if(submitted){
      html += `<div class="tt-admin-warn" style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
        <span>✓ Bulan ${bulan} sudah disubmit${subInfo.date?(' pada '+esc(subInfo.date)):''}${subInfo.by?(' oleh '+esc(subInfo.by)):''}.</span>
        <button class="tt-icon-btn" data-unsubmitbulan="${bulan}" style="flex-shrink:0;">Buka kembali untuk edit</button>
      </div>`;
    }

    html += `<div class="tt-bulan-fields"${submitted?' style="pointer-events:none; opacity:.6;"':''}>`;

    let lastKat = null;
    bulanItems.forEach((it, idx)=>{
      if(it.kat !== lastKat){
        html += `<div class="tt-kategori">${esc(it.kat)}</div>`;
        lastKat = it.kat;
        const menuFields = state.depts[state.dept].menuFields;

          const menuVal = (prog['menu_'+it.kode] && prog['menu_'+it.kode].value) || '';

      const v = prog['item_'+it.no] || {};
      const effStatus = v.status || 'Belum Diajarkan';

  area.innerHTML = html;
  bindChecklistEvents(emp.id);
}

function bindChecklistEvents(empId){
  document.querySelectorAll('.tt-bulan-head').forEach(h=>{
    h.addEventListener('click', ()=>{
      if(h.dataset.locked === '1'){
        showToast('Selesaikan & submit bulan sebelumnya dulu');
        return;
      }
      const b = h.dataset.bulan;
      state.openBulan[b] = !state.openBulan[b];
      renderChecklist();
    });
  });

  document.querySelectorAll('.menu-name-input').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const kode = inp.dataset.kode;
      state.progress[empId] = state.progress[empId] || {};
      state.progress[empId]['menu_'+kode] = { value: inp.value };
      await saveProgress(empId);
      showToast();
    });
  });

  document.querySelectorAll('.tt-item').forEach(itemEl=>{
    const no = itemEl.dataset.itemno;
    const key = 'item_'+no;

    itemEl.querySelectorAll('.tt-pill').forEach(pill=>{
      pill.addEventListener('click', async ()=>{
        state.progress[empId] = state.progress[empId] || {};
        state.progress[empId][key] = state.progress[empId][key] || {};
        state.progress[empId][key].status = pill.dataset.val;
        if(!state.progress[empId][key].date){
          state.progress[empId][key].date = new Date().toISOString().slice(0,10);
        }
        if(!state.progress[empId][key].paraf && state.leaderName){
          state.progress[empId][key].paraf = state.leaderName;
        }
        await saveProgress(empId, key);
        renderChecklist();
        showToast();
      });
    });

    const noteInp = itemEl.querySelector('.item-note');
    noteInp.addEventListener('change', async ()=>{
      state.progress[empId] = state.progress[empId] || {};
      state.progress[empId][key] = state.progress[empId][key] || {};
      state.progress[empId][key].note = noteInp.value;
      await saveProgress(empId, key);
      showToast();
    });
  });

  // ---- Submit / buka-kembali per bulan ----
  document.querySelectorAll('[data-submitbulan]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const bulan = Number(btn.dataset.submitbulan);
      const statsNow = computeStats(empId, state.dept);
      const bsNow = statsNow.byBulan[bulan];
      const complete = bsNow.total>0 && bsNow.done===bsNow.total;
      const msg = complete
        ? 'Submit Bulan '+bulan+'? Bulan berikutnya akan terbuka & bulan ini terkunci (bisa dibuka lagi kalau perlu edit).'
        : 'Progres Bulan '+bulan+' baru '+bsNow.done+'/'+bsNow.total+' poin. Submit tetap akan menyimpan progres & membuka Bulan berikutnya, dan bulan ini terkunci sampai dibuka lagi. Lanjutkan?';
      if(!confirm(msg)) return;

      const key = 'submit_bulan'+bulan;
      state.progress[empId] = state.progress[empId] || {};
      state.progress[empId][key] = {
        submitted: true,
        date: new Date().toISOString().slice(0,10),
        by: state.leaderName || (state.session ? state.session.name : '')
      };
      await saveProgress(empId, key);
      renderChecklist();
      showToast('Bulan '+bulan+' berhasil disubmit');
    });
  });

  document.querySelectorAll('[data-unsubmitbulan]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const bulan = btn.dataset.unsubmitbulan;
      if(!confirm('Buka kembali Bulan '+bulan+' untuk diedit? Bulan berikutnya (kalau sudah terbuka) akan terkunci lagi sampai bulan ini disubmit ulang.')) return;
      const key = 'submit_bulan'+bulan;
      state.progress[empId] = state.progress[empId] || {};
      state.progress[empId][key] = { submitted: false };
      await saveProgress(empId, key);
      renderChecklist();
      showToast('Bulan '+bulan+' dibuka kembali untuk edit');
    });
  });
}

// Kartu ringkasan validasi read-only, dipakai di halaman Leader (tidak bisa diedit)
function renderValidasiReadOnlyCard(bulan, items, prog){
  const vKey = 'validasi_bulan'+bulan;
  const vv = prog[vKey] || {};
  const doneItems = items.filter(it=>it.bulan===bulan && !it.final && (prog['item_'+it.no]||{}).status === 'Sudah Dikuasai');
  let validCount = 0, invalidCount = 0;
  doneItems.forEach(it=>{
    const vi = prog['val_item_'+it.no];
    if(vi && vi.valid === 'Valid') validCount++;
    else if(vi && vi.valid === 'Tidak Valid') invalidCount++;
  });
  const ratedCount = validCount + invalidCount;

  return `<div class="tt-card" style="border-color:var(--brass);">
    <span class="tt-label">Validasi Bulan ${bulan} <span style="font-weight:400; text-transform:none; color:var(--sage);">&middot; diisi Validator</span></span>
    <div style="font-size:12.5px; color:var(--sage); margin-top:8px;">
      ${doneItems.length===0
        ? 'Belum ada poin &quot;Sudah Dikuasai&quot; untuk divalidasi.'
        : ratedCount+'/'+doneItems.length+' poin sudah dinilai'+(ratedCount>0?` &middot; <span style="color:#3E7D53; font-weight:600;">${validCount} Valid</span>`+(invalidCount>0?`, <span style="color:var(--terracotta); font-weight:600;">${invalidCount} Tidak Valid</span>`:''):'')}
    </div>
    ${vv.foto?`<div style="margin-top:10px;"><img src="${vv.foto}" style="width:56px; height:56px; object-fit:cover; border-radius:8px; border:1.5px solid var(--line);"></div>`:''}
    ${vv.catatan?`<div style="font-size:12px; color:var(--sage); margin-top:8px;">Catatan: ${esc(vv.catatan)}</div>`:''}
    ${vv.submitted
      ? `<div style="font-size:12px; color:var(--teal-2); font-weight:600; margin-top:8px;">✓ Disubmit${vv.tanggal?(' pada '+esc(vv.tanggal)):''}${vv.validator?(' oleh '+esc(vv.validator)):''}</div>`
      : `<div style="font-size:11.5px; color:var(--sage); margin-top:8px; font-style:italic;">Menunggu Validator submit validasi bulan ini.</div>`}
  </div>`;
}

// Panel validasi per-poin yang bisa diisi Validator. Poin yang bisa dinilai
// hanya yang statusnya "Sudah Dikuasai" dari leader. Foto bukti & submit tetap 1x per bulan.
function renderValidationPanel(){
  const area = document.getElementById('checklistArea');
  if(!area) return;
  const emp = state.employees.find(e=>e.id===state.currentEmployeeId);
  if(!emp){ area.innerHTML=''; return; }
  const items = deptItemsFor(state.dept);
  const prog = state.progress[emp.id] || {};
  const stats = computeStats(emp.id, state.dept);

  let html = `<div class="tt-card">
    <span class="tt-label">Validasi untuk</span>
    <div style="font-weight:700; font-size:16px; font-family:'Fraunces',serif; color:var(--teal)">${esc(emp.name)} &middot; ${state.depts[state.dept].label}</div>
  </div>`;

  [1,2,3].forEach(bulan=>{
    const bulanItems = items.filter(it=>it.bulan===bulan && !it.final);
    const doneItems = bulanItems.filter(it=>(prog['item_'+it.no]||{}).status === 'Sudah Dikuasai');
    const pendingCount = bulanItems.length - doneItems.length;
    const vKey = 'validasi_bulan'+bulan;
    const vv = prog[vKey] || {};
    const vSubmitted = !!vv.submitted;
    const bulanComplete = isBulanComplete(stats, bulan);

    let ratedCount = 0;
    doneItems.forEach(it=>{ if((prog['val_item_'+it.no]||{}).valid) ratedCount++; });
    // Foto cuma wajib begitu leader sudah menyelesaikan SEMUA poin di bulan ini.
    // Sebelum itu, validator tetap bisa submit progres tanpa foto.
    const canSubmitVal = bulanComplete ? !!vv.foto : true;

    html += `<div class="tt-card tt-bulan-block">
      <div class="tt-bulan-head" style="cursor:default;">
        <div class="tt-bulan-head-top">
          <div class="tt-bulan-title">Bulan ${bulan} — ${BULAN_TITLE[bulan]}${vSubmitted?' ✓':''}</div>
          <div class="tt-bulan-pct">${ratedCount}/${doneItems.length}</div>
        </div>
        <div class="tt-bulan-progress-track"><div class="tt-bulan-progress-fill" style="width:${doneItems.length?Math.round(ratedCount/doneItems.length*100):0}%"></div></div>
        <div style="font-size:11.5px; color:var(--sage);">${doneItems.length} poin siap divalidasi${pendingCount>0?' &middot; '+pendingCount+' poin belum &quot;Sudah Dikuasai&quot;':''}</div>
      </div>`;

    if(doneItems.length === 0){
      html += `<div style="padding:8px 4px 4px; font-size:12.5px; color:var(--sage);">Belum ada poin berstatus &quot;Sudah Dikuasai&quot; di bulan ini untuk divalidasi.</div></div>`;
      return;
    }

    if(vSubmitted){
      html += `<div class="tt-admin-warn" style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
        <span>✓ Validasi Bulan ${bulan} sudah disubmit${vv.tanggal?(' pada '+esc(vv.tanggal)):''}${vv.validator?(' oleh '+esc(vv.validator)):''}.${ratedCount<doneItems.length?' Ada poin baru yang belum dinilai.':''}${bulanComplete && !vv.foto?' Bulan ini sudah lengkap &mdash; foto bukti wajib dilengkapi.':''}</span>
        <button class="tt-icon-btn" data-unsubmitval="${bulan}" style="flex-shrink:0;">Buka kembali untuk edit</button>
      </div>`;
    }

    html += `<div class="tt-bulan-fields"${vSubmitted?' style="pointer-events:none; opacity:.6;"':''}>`;

    let lastKat = null;
    doneItems.forEach((it, idx)=>{
      if(it.kat !== lastKat){
        html += `<div class="tt-kategori">${esc(it.kat)}</div>`;
        lastKat = it.kat;
      }
      const vi = prog['val_item_'+it.no] || {};
      html += `<div class="tt-item" data-valitemno="${it.no}">
        <div class="tt-item-row">
          <div class="tt-item-num">${idx+1}</div>
          <div class="tt-item-body">
            <div class="tt-item-point">${esc(it.point)}</div>
            <div class="tt-item-kode">${esc(it.kode)}</div>
            <div class="tt-status-pills">
              <div class="tt-pill" data-val="Valid" style="${vi.valid==='Valid'?'background:var(--teal-2); border-color:var(--teal-2); color:#fff;':''}">Valid</div>
              <div class="tt-pill" data-val="Tidak Valid" style="${vi.valid==='Tidak Valid'?'background:var(--terracotta); border-color:var(--terracotta); color:#fff;':''}">Tidak Valid</div>
            </div>
            <div class="tt-item-grid">
              <input type="text" class="val-item-note" data-valno="${it.no}" placeholder="Catatan (opsional)" value="${esc(vi.catatan||'')}" style="grid-column:1/-1;">
            </div>
          </div>
        </div>
      </div>`;
    });

    const fotoLabelSuffix = vv.foto ? '' : (bulanComplete
      ? '<span style="color:var(--terracotta); text-transform:none; font-weight:700;">&middot; wajib diisi (bulan ini sudah lengkap)</span>'
      : '<span style="color:var(--sage); text-transform:none; font-weight:400;">&middot; opsional dulu, wajib kalau semua poin bulan ini sudah &quot;Sudah Dikuasai&quot;</span>');

    html += `<div class="tt-field" style="margin-top:14px; margin-bottom:10px;">
      <span class="tt-label">Foto Bukti Validasi Bulan ${bulan} ${fotoLabelSuffix}</span>
      <input type="file" accept="image/*" capture="environment" class="tt-input val-foto" data-vbulan="${bulan}">
      ${vv.foto?`<div style="margin-top:8px; display:flex; align-items:center; gap:8px;">
        <img src="${vv.foto}" style="width:64px; height:64px; object-fit:cover; border-radius:8px; border:1.5px solid var(--line);">
        <span style="font-size:12px; color:var(--teal-2); font-weight:600;">Foto tersimpan &middot; pilih file lagi untuk ganti</span>
      </div>`:'<div style="font-size:11.5px; color:var(--sage); margin-top:6px;">Ambil foto langsung dari kamera atau pilih dari galeri (1x untuk seluruh bulan ini).</div>'}
    </div>
    <div class="tt-item-grid">
      <input type="text" class="tt-item-note val-note" data-vbulan="${bulan}" placeholder="Catatan validator umum (opsional)" value="${esc(vv.catatan||'')}" style="grid-column:1/-1;">
    </div>`;

    html += `</div>`; // tutup .tt-bulan-fields

    if(!vSubmitted){
      html += `<div style="padding:10px 2px 2px;">
        <button class="tt-btn ${canSubmitVal?'tt-btn-primary':'tt-btn-ghost'}" data-submitval="${bulan}" ${canSubmitVal?'':'disabled'} style="width:100%;">Submit Validasi Progres</button>
        <div style="font-size:11.5px; color:var(--sage); margin-top:6px; text-align:center;">${canSubmitVal?'Wajib submit untuk menyimpan progres validasi.':'Bulan ini sudah lengkap &mdash; upload foto bukti dulu sebelum submit.'}</div>
      </div>`;
    }

    html += `</div>`; // tutup .tt-card.tt-bulan-block
  });

  area.innerHTML = html;
  bindValidationEvents(emp.id);
}

function bindValidationEvents(empId){
  document.querySelectorAll('.tt-item[data-valitemno]').forEach(itemEl=>{
    const no = itemEl.dataset.valitemno;
    const key = 'val_item_'+no;
    itemEl.querySelectorAll('.tt-pill').forEach(pill=>{
      pill.addEventListener('click', async ()=>{
        state.progress[empId] = state.progress[empId] || {};
        state.progress[empId][key] = state.progress[empId][key] || {};
        state.progress[empId][key].valid = pill.dataset.val;
        await saveProgress(empId, key);
        renderValidationPanel();
        showToast();
      });
    });
  });

  document.querySelectorAll('.val-item-note').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const no = inp.dataset.valno;
      const key = 'val_item_'+no;
      state.progress[empId] = state.progress[empId] || {};
      state.progress[empId][key] = state.progress[empId][key] || {};
      state.progress[empId][key].catatan = inp.value;
      await saveProgress(empId, key);
      showToast();
    });
  });

  document.querySelectorAll('.val-foto').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const file = inp.files && inp.files[0];
      if(!file) return;
      const bulan = inp.dataset.vbulan;
      const vKey = 'validasi_bulan'+bulan;
      const emp = state.employees.find(e=>e.id===empId);
      try{
        showToast('Memproses foto...');
        const dataUrl = await compressImage(file);
        showToast('Mengupload foto...');
        const url = await uploadFotoToServer(dataUrl, emp ? emp.name : '', bulan);
        state.progress[empId] = state.progress[empId] || {};
        state.progress[empId][vKey] = state.progress[empId][vKey] || {};
        state.progress[empId][vKey].foto = url;
        state.progress[empId][vKey].validator = state.session.name;
        await saveProgress(empId, vKey);
        renderValidationPanel();
        showToast('Foto tersimpan');
      }catch(err){
        console.error('Gagal memproses/upload foto', err);
        showToast('Gagal upload foto. Cek koneksi & coba lagi.');
      }
    });
  });

  document.querySelectorAll('.val-note').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const bulan = inp.dataset.vbulan;
      const vKey = 'validasi_bulan'+bulan;
      state.progress[empId] = state.progress[empId] || {};
      state.progress[empId][vKey] = state.progress[empId][vKey] || {};
      state.progress[empId][vKey].catatan = inp.value;
      state.progress[empId][vKey].validator = state.session.name;
      await saveProgress(empId, vKey);
      showToast();
    });
  });

  document.querySelectorAll('[data-submitval]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const bulan = btn.dataset.submitval;
      const vKey = 'validasi_bulan'+bulan;
      state.progress[empId] = state.progress[empId] || {};
      state.progress[empId][vKey] = state.progress[empId][vKey] || {};
      state.progress[empId][vKey].validator = state.session.name;
      state.progress[empId][vKey].submitted = true;
      state.progress[empId][vKey].tanggal = state.progress[empId][vKey].tanggal || new Date().toISOString().slice(0,10);
      await saveProgress(empId, vKey);
      renderValidationPanel();
      showToast('Validasi Bulan '+bulan+' berhasil disubmit');
    });
  });

  document.querySelectorAll('[data-unsubmitval]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const bulan = btn.dataset.unsubmitval;
      if(!confirm('Buka kembali validasi Bulan '+bulan+' untuk diedit?')) return;
      const vKey = 'validasi_bulan'+bulan;
      state.progress[empId] = state.progress[empId] || {};
      state.progress[empId][vKey] = state.progress[empId][vKey] || {};
      state.progress[empId][vKey].submitted = false;
      await saveProgress(empId, vKey);
      renderValidationPanel();
      showToast('Validasi Bulan '+bulan+' dibuka kembali');
    });
  });
}
async function renderDashboard(){
  if(state.dashDetailId){
    await renderDashboardDetail();
    return;
  }
  let html = '';
  const outlets = outletList();

  html += `<div class="tt-filters">
    <input type="text" id="filterName" class="tt-input" style="width:auto; min-width:170px; flex:1;" placeholder="Cari nama karyawan..." value="${esc(state.dashFilterName)}">
    <select id="filterOutlet">
      <option value="">Semua Outlet</option>
      ${outlets.map(o=>`<option value="${esc(o)}" ${state.dashFilterOutlet===o?'selected':''}>${esc(o)}</option>`).join('')}
    </select>
    <select id="filterDept">
      <option value="">Semua Departemen</option>
      ${Object.keys(state.depts).map(k=>`<option value="${k}" ${state.dashFilterDept===k?'selected':''}>${state.depts[k].label}</option>`).join('')}
    </select>
  </div>`;

  if(!state.dashFiltersTouched){
    html += `<div class="tt-empty">Pilih Outlet dan/atau Departemen dulu di atas untuk menampilkan data.<br>Mau lihat semua? Pilih salah satu dropdown lalu biarkan di "Semua Outlet"/"Semua Departemen".</div>`;
    root.innerHTML = html;
    bindDashboardFilterEvents();
    return;
  }

  let list = state.employees.filter(e=>{
    if(state.dashFilterOutlet && e.outlet !== state.dashFilterOutlet) return false;
    if(state.dashFilterDept && e.department !== state.dashFilterDept) return false;
    if(state.dashFilterName && !e.name.toLowerCase().includes(state.dashFilterName.trim().toLowerCase())) return false;
    return true;
  });

  for(const e of list){ await loadProgress(e.id); }

  const totalEmp = list.length;
  const lulusCount = list.filter(e=>computeProbationStatus(e).kind==='lulus').length;
  const berjalanCount = totalEmp - lulusCount;

  const outletGroups = {};
  list.forEach(e=>{ (outletGroups[e.outlet] = outletGroups[e.outlet]||[]).push(e); });
  const outletStats = Object.keys(outletGroups).map(o=>{
    const emps = outletGroups[o];
    let sumPct = 0, lulus = 0;
    emps.forEach(e=>{
      const st = computeStats(e.id, e.department);
      sumPct += st.overallPct;
      if(computeProbationStatus(e).kind==='lulus') lulus++;
    });
    return { outlet:o, avgPct: emps.length ? Math.round(sumPct/emps.length) : 0, total: emps.length, lulus };
  }).sort((a,b)=> a.avgPct - b.avgPct || a.outlet.localeCompare(b.outlet));

  if(outletStats.length){
    html += `<div class="tt-card">
      <span class="tt-label">Penyelesaian Probation per Outlet</span>
      <div class="tt-outlet-stats">
        ${outletStats.map(os=>{
          const fillColor = os.avgPct < 40 ? 'var(--terracotta)' : os.avgPct >= 100 ? '#3E7D53' : '#C98A3E';
          return `<div class="tt-outlet-row">
          <div class="tt-outlet-row-top"><span>${esc(os.outlet)}</span><span style="color:${fillColor}">${os.avgPct}%</span></div>
          <div class="tt-outlet-track"><div class="tt-outlet-fill" style="width:${os.avgPct}%; background:${fillColor};"></div></div>
          <div class="tt-outlet-meta">${os.lulus} pembelajaran selesai &middot; ${os.total} karyawan</div>
        </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  html += `<div class="tt-summary-cards">
    <div class="tt-sumcard"><div class="tt-sumnum">${totalEmp}</div><div class="tt-sumlabel">Karyawan</div></div>
    <div class="tt-sumcard"><div class="tt-sumnum">${lulusCount}</div><div class="tt-sumlabel">Pembelajaran Selesai</div></div>
    <div class="tt-sumcard"><div class="tt-sumnum">${berjalanCount}</div><div class="tt-sumlabel">Masih Berjalan</div></div>
  </div>`;

  if(list.length === 0){
    html += `<div class="tt-empty">Belum ada data karyawan${(state.dashFilterOutlet||state.dashFilterDept||state.dashFilterName)?' untuk filter ini':''}.<br>Mulai isi dari tab "Isi Checklist".</div>`;
  } else {
    html += `<div class="tt-card" style="padding:0; overflow-x:auto;">
      <table class="tt-table">
        <thead><tr>
          <th>Karyawan</th><th>Outlet</th><th>Dept</th><th>E-Learning</th><th>B1</th><th>B2</th><th>B3</th><th>Total</th><th>Tahap Saat Ini</th><th>Status Probation</th><th>Validasi</th>
        </tr></thead>
        <tbody>`;
    list.forEach(e=>{
      const st = computeStats(e.id, e.department);
      const probation = computeProbationStatus(e);
      const badgeClassMap = { lulus:'lulus', tidak:'tidak', proses:'jalan', warn:'warn' };
      const badge = `<span class="tt-badge ${badgeClassMap[probation.kind]}">${esc(probation.label)}</span>`;
      const elCell = probation.teoriPct === null
        ? '<span style="color:var(--sage); font-style:italic; font-size:11.5px;">tidak ditemukan</span>'
        : `${probation.teoriPct}%`;
      const verdict = computeValidasiVerdict(e.id, e.department);
      const valBadge = verdict==='Valid' ? '<span class="tt-badge lulus">Valid</span>'
                      : verdict==='Tidak Valid' ? '<span class="tt-badge tidak">Tidak Valid</span>'
                      : '<span class="tt-badge tambahan">Proses Validasi</span>';
      const pctCell = (b)=>{
        const bs = st.byBulan[b]; const p = bs.total?Math.round(bs.done/bs.total*100):0;
        return `<div class="tt-bar-cell"><div class="tt-bar-track"><div class="tt-bar-fill" style="width:${p}%"></div></div><span>${p}%</span></div>`;
      };
      html += `<tr data-emp="${e.id}">
        <td style="font-weight:600">${esc(e.name)}</td>
        <td>${esc(e.outlet)}</td>
        <td>${state.depts[e.department].label}</td>
        <td>${elCell}</td>
        <td>${pctCell(1)}</td><td>${pctCell(2)}</td><td>${pctCell(3)}</td>
        <td style="font-weight:700">${st.overallPct}%</td>
        <td style="white-space:nowrap;">${esc(currentStageLabel(st))}</td>
        <td>${badge}</td>
        <td>${valBadge}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }

  root.innerHTML = html;
  bindDashboardFilterEvents();

  document.querySelectorAll('#ttBody tr[data-emp]').forEach(row=>{
    row.addEventListener('click', ()=>{ state.dashDetailId = row.dataset.emp; renderDashboard(); });
  });
}

function bindDashboardFilterEvents(){
  const fn = document.getElementById('filterName');
  if(fn){
    fn.addEventListener('input', ()=>{
      state.dashFilterName = fn.value;
      state.dashFiltersTouched = true;
      const cursorPos = fn.selectionStart;
      renderDashboard().then(()=>{
        const newFn = document.getElementById('filterName');
        if(newFn){ newFn.focus(); newFn.setSelectionRange(cursorPos, cursorPos); }
      });
    });
  }
  const fo = document.getElementById('filterOutlet');
  if(fo) fo.addEventListener('change', ()=>{ state.dashFilterOutlet = fo.value; state.dashFiltersTouched = true; renderDashboard(); });
  const fd = document.getElementById('filterDept');
  if(fd) fd.addEventListener('change', ()=>{ state.dashFilterDept = fd.value; state.dashFiltersTouched = true; renderDashboard(); });
}

async function renderDashboardDetail(){
  const emp = state.employees.find(e=>e.id===state.dashDetailId);
  if(!emp){ state.dashDetailId=null; renderDashboard(); return; }
  await loadProgress(emp.id);
  const items = deptItemsFor(emp.department);
  const prog = state.progress[emp.id] || {};
  const stats = computeStats(emp.id, emp.department);

  let html = `<div class="tt-back" id="backToList">&larr; Kembali ke daftar</div>`;
  html += `<div class="tt-card">
    <div style="font-weight:700; font-size:17px; font-family:'Fraunces',serif; color:var(--teal)">${esc(emp.name)}</div>
    <div style="font-size:12.5px; color:var(--sage); margin-top:2px">${esc(emp.outlet)} &middot; ${state.depts[emp.department].label} &middot; Mulai ${emp.startDate||'-'}</div>
    <div style="font-size:12.5px; margin-top:6px; font-weight:600; color:var(--teal)">Progres keseluruhan: ${stats.overallPct}%</div>
  </div>`;

  [1,2,3].forEach(bulan=>{
    const bulanItems = items.filter(it=>it.bulan===bulan);
    html += `<div class="tt-card">
      <div style="font-weight:700; font-size:14px; color:var(--teal); margin-bottom:8px; border-bottom:2px solid var(--brass); padding-bottom:6px;">Bulan ${bulan} — ${BULAN_TITLE[bulan]}</div>`;
    let lastKat = null;
    bulanItems.forEach(it=>{
      if(it.kat!==lastKat){ html += `<div class="tt-kategori">${esc(it.kat)}</div>`; lastKat = it.kat; }
      const v = prog['item_'+it.no] || {};
      const badgeClass = v.status==='Sudah Dikuasai' || v.status==='Lulus Probation' ? 'lulus'
                        : v.status==='Tidak Lulus' ? 'tidak'
                        : v.status ? 'tambahan' : 'jalan';
      html += `<div style="display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:12.5px;">
        <div style="flex:1">${esc(it.point)}${v.note?`<div style="color:var(--sage); font-size:11.5px; margin-top:2px;">Catatan: ${esc(v.note)}</div>`:''}</div>
        <div style="text-align:right; white-space:nowrap;">
          <span class="tt-badge ${badgeClass}">${esc(statusLabel(v.status)||'Belum Diajarkan')}</span>
          <div style="font-size:10.5px; color:var(--sage); margin-top:3px;">${v.date||''} ${v.paraf?('&middot; '+esc(v.paraf)):''}</div>
        </div>
      </div>`;
    });
    html += `</div>`;
  });

  root.innerHTML = html;
  document.getElementById('backToList').addEventListener('click', ()=>{ state.dashDetailId=null; renderDashboard(); });
}

    <div style="margin-top:8px;">
      <button class="tt-btn tt-btn-brass" id="savePanduanBtn">Simpan Panduan</button>
    </div>
  </div>`;

  html += `<div class="tt-card">
    <span class="tt-label">Akun Leader Terdaftar</span>
    <div style="font-size:11.5px; color:var(--sage); margin-bottom:8px;">Leader mendaftar sendiri lewat halaman login. Hapus akun di sini kalau leader resign atau perlu daftar ulang (misal lupa password).</div>
    <div class="tt-chip-list">
      ${state.leaderAccounts.map(a=>`<div class="tt-chip">${esc(a.name)} &middot; ${esc(a.email)}<button data-delleaderacc="${esc(a.email)}" title="Hapus akun">&times;</button></div>`).join('') || '<div style="font-size:12.5px; color:var(--sage);">Belum ada leader yang mendaftar.</div>'}
    </div>
  </div>`;

  html += `<div class="tt-card">
    <span class="tt-label">Outlet</span>
    <div class="tt-chip-list">
      ${state.outlets.map(o=>`<div class="tt-chip">${esc(o)}<button data-deloutlet="${esc(o)}" title="Hapus">&times;</button></div>`).join('') || '<div style="font-size:12.5px; color:var(--sage);">Belum ada outlet.</div>'}
    </div>
    <div class="tt-inline-add">
      <input type="text" id="newOutletInput" class="tt-input" placeholder="Nama outlet baru">
      <button class="tt-btn tt-btn-brass" id="addOutletBtn">+ Tambah</button>
    </div>
  </div>`;

  html += `<div class="tt-card">
    <span class="tt-label">Akun Validator Terdaftar</span>
    <div style="font-size:11.5px; color:var(--sage); margin-bottom:8px;">Validator mendaftar sendiri lewat halaman login (pilih peran "Validator"). Hapus akun di sini kalau perlu daftar ulang.</div>
    <div class="tt-chip-list">
      ${state.validatorAccounts.map(a=>`<div class="tt-chip">${esc(a.name)} &middot; ${esc(a.email)}<button data-delvalidatoracc="${esc(a.email)}" title="Hapus akun">&times;</button></div>`).join('') || '<div style="font-size:12.5px; color:var(--sage);">Belum ada validator yang mendaftar.</div>'}
    </div>
  </div>`;

  html += `<div class="tt-card">
    <span class="tt-label">Ganti PIN Admin</span>
    <div class="tt-inline-add">
      <input type="text" inputmode="numeric" id="newPinInput" class="tt-input" placeholder="PIN baru">
      <button class="tt-btn tt-btn-ghost" id="savePinBtn">Simpan</button>
    </div>
  </div>`;

  html += `<div class="tt-card">
    <span class="tt-label">Departemen</span>
    <div class="tt-dept-grid">
      ${Object.keys(state.depts).map(k=>`<div class="tt-dept-btn ${deptKey===k?'active':''}" data-admindept="${k}">${state.depts[k].label}</div>`).join('')}
    </div>
  </div>`;

  [1,2,3].forEach(bulan=>{
    const items = dept.items.filter(it=>it.bulan===bulan).sort((a,b)=>a.no-b.no);
    html += `<div class="tt-card">
      <div style="font-weight:700; font-size:14px; color:var(--teal); margin-bottom:8px; border-bottom:2px solid var(--brass); padding-bottom:6px;">Bulan ${bulan} — ${BULAN_TITLE[bulan]}</div>`;

    items.forEach(it=>{
      if(state.adminEditingNo === it.no){
        html += renderAdminEditForm(deptKey, it);
      } else {
        html += `<div class="tt-admin-item">
          <div class="tt-admin-item-text">
            <div class="tt-admin-item-meta">${esc(it.kode)} &middot; ${esc(it.kat)}${it.final?' &middot; Item Kesimpulan Akhir':''}</div>
            <div class="tt-admin-item-point">${esc(it.point)}</div>
          </div>
          <div class="tt-admin-actions">
            <button class="tt-icon-btn" data-editno="${it.no}">Edit</button>
            ${state.adminConfirmDeleteNo===it.no
              ? `<button class="tt-icon-btn confirm" data-confirmdelno="${it.no}">Yakin hapus?</button><button class="tt-icon-btn" data-canceldelno="${it.no}">Batal</button>`
              : `<button class="tt-icon-btn danger" data-delno="${it.no}">Hapus</button>`}
          </div>
        </div>`;
      }
    });

    if(state.adminAdding === bulan){
      html += renderAdminAddForm(deptKey, bulan);
    } else {
      html += `<button class="tt-btn tt-btn-ghost" data-addbulan="${bulan}" style="width:100%; margin-top:4px;">+ Tambah Poin di Bulan ${bulan}</button>`;
    }

    html += `</div>`;
  });

  root.innerHTML = html;
  bindAdminEvents(deptKey);
}

function renderAdminEditForm(deptKey, it){
  return `<div class="tt-admin-item tt-admin-add-card">
    <div class="tt-admin-edit-form">
      <div class="tt-field"><span class="tt-label">Kode</span><input type="text" class="tt-input adm-kode" value="${esc(it.kode)}"></div>
      <div class="tt-field"><span class="tt-label">Kategori / Kompetensi</span><input type="text" class="tt-input adm-kat" value="${esc(it.kat)}"></div>
      <div class="tt-field"><span class="tt-label">Bulan</span>
        <select class="tt-input adm-bulan">
          ${[1,2,3].map(b=>`<option value="${b}" ${it.bulan===b?'selected':''}>Bulan ${b}</option>`).join('')}
        </select>
      </div>
      <div class="tt-field"><span class="tt-label">Poin yang Harus Diajarkan / Dicek</span><input type="text" class="tt-input adm-point" value="${esc(it.point)}"></div>
      <div class="tt-field" style="display:flex; align-items:center; gap:7px;">
        <input type="checkbox" class="adm-final" id="admFinal${it.no}" ${it.final?'checked':''} style="width:auto;">
        <label for="admFinal${it.no}" style="font-size:12.5px;">Ini item Kesimpulan Akhir (pilihan Lulus / Perlu Tambahan Waktu / Tidak Lulus)</label>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="tt-btn tt-btn-primary" data-savenno="${it.no}">Simpan</button>
        <button class="tt-btn tt-btn-ghost" data-canceleditno="${it.no}">Batal</button>
      </div>
    </div>
  </div>`;
}

function renderAdminAddForm(deptKey, bulan){
  return `<div class="tt-admin-item tt-admin-add-card">
    <div class="tt-admin-edit-form">
      <div class="tt-field"><span class="tt-label">Kode</span><input type="text" class="tt-input add-kode" placeholder="Contoh: A9"></div>
      <div class="tt-field"><span class="tt-label">Kategori / Kompetensi</span><input type="text" class="tt-input add-kat" placeholder="Contoh: Kebersihan Area Kerja"></div>
      <div class="tt-field"><span class="tt-label">Poin yang Harus Diajarkan / Dicek</span><input type="text" class="tt-input add-point" placeholder="Tulis indikatornya di sini"></div>
      <div class="tt-field" style="display:flex; align-items:center; gap:7px;">
        <input type="checkbox" class="add-final" id="addFinal${bulan}" style="width:auto;">
        <label for="addFinal${bulan}" style="font-size:12.5px;">Ini item Kesimpulan Akhir</label>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="tt-btn tt-btn-primary" data-saveaddbulan="${bulan}">Tambah Poin</button>
        <button class="tt-btn tt-btn-ghost" data-canceladdbulan="${bulan}">Batal</button>
      </div>
    </div>
  </div>`;
}

function bindAdminEvents(deptKey){
  const lockBtn = document.getElementById('adminLockBtn');
  if(lockBtn) lockBtn.addEventListener('click', ()=>{ state.adminUnlocked = false; render(); });

  const savePanduanBtn = document.getElementById('savePanduanBtn');
  if(savePanduanBtn) savePanduanBtn.addEventListener('click', async ()=>{
    const ta = document.getElementById('panduanTextarea');
    state.panduanText = ta.value;
    await savePanduan();
    showToast('Panduan disimpan');
  });

  const exportJsonBtn = document.getElementById('exportJsonBtn');
  if(exportJsonBtn) exportJsonBtn.addEventListener('click', async ()=>{
    exportJsonBtn.disabled = true; exportJsonBtn.textContent = 'Menyiapkan...';
    try{ await exportBackupJson(); showToast('Backup diunduh'); }
    catch(e){ console.error(e); showToast('Gagal export'); }
    finally{ exportJsonBtn.disabled = false; exportJsonBtn.textContent = 'Export Backup Lengkap (JSON)'; }
  });

  const exportCsvBtn = document.getElementById('exportCsvBtn');
  if(exportCsvBtn) exportCsvBtn.addEventListener('click', async ()=>{
    exportCsvBtn.disabled = true; exportCsvBtn.textContent = 'Menyiapkan...';
    try{ await exportSummaryCsv(); showToast('Ringkasan CSV diunduh'); }
    catch(e){ console.error(e); showToast('Gagal export'); }
    finally{ exportCsvBtn.disabled = false; exportCsvBtn.textContent = 'Export Ringkasan Karyawan (CSV)'; }
  });

  document.querySelectorAll('[data-delleaderacc]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const email = b.dataset.delleaderacc;
      if(!confirm('Hapus akun ini? Leader harus daftar ulang untuk bisa login lagi.')) return;
      state.leaderAccounts = state.leaderAccounts.filter(a=>a.email!==email);
      await saveLeaderAccounts();
      renderAdmin();
      showToast('Akun leader dihapus');
    });
  });

  const addOutletBtn = document.getElementById('addOutletBtn');
  if(addOutletBtn) addOutletBtn.addEventListener('click', async ()=>{
    const input = document.getElementById('newOutletInput');
    const name = input.value.trim();
    if(!name){ showToast('Nama outlet wajib diisi'); return; }
    if(state.outlets.includes(name)){ showToast('Outlet sudah ada'); return; }
    state.outlets.push(name);
    await saveOutlets();
    renderAdmin();
    showToast('Outlet ditambahkan');
  });
  document.querySelectorAll('[data-deloutlet]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      state.outlets = state.outlets.filter(o=>o!==b.dataset.deloutlet);
      await saveOutlets();
      renderAdmin();
      showToast('Outlet dihapus');
    });
  });

  document.querySelectorAll('[data-delvalidatoracc]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const email = b.dataset.delvalidatoracc;
      if(!confirm('Hapus akun validator ini? Validator harus daftar ulang untuk bisa login lagi.')) return;
      state.validatorAccounts = state.validatorAccounts.filter(a=>a.email!==email);
      await saveValidatorAccounts();
      renderAdmin();
      showToast('Akun validator dihapus');
    });
  });

  const savePinBtn = document.getElementById('savePinBtn');
  if(savePinBtn) savePinBtn.addEventListener('click', async ()=>{
    const input = document.getElementById('newPinInput');
    const pin = input.value.trim();
    if(!pin){ showToast('PIN wajib diisi'); return; }
    state.adminPin = pin;
    await saveAdminPin();
    input.value = '';
    showToast('PIN admin diperbarui');
  });

  document.querySelectorAll('[data-admindept]').forEach(b=>{
    b.addEventListener('click', ()=>{
      state.adminDept = b.dataset.admindept;
      state.adminEditingNo = null; state.adminAdding = false; state.adminConfirmDeleteNo = null;
      renderAdmin();
    });
  });

  document.querySelectorAll('[data-editno]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.adminEditingNo = Number(b.dataset.editno); state.adminAdding=false; renderAdmin(); });
  });
  document.querySelectorAll('[data-canceleditno]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.adminEditingNo = null; renderAdmin(); });
  });
  document.querySelectorAll('[data-savenno]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const no = Number(b.dataset.savenno);
      const form = b.closest('.tt-admin-edit-form');
      const dept = state.depts[deptKey];
      const it = dept.items.find(x=>x.no===no);
      it.kode = form.querySelector('.adm-kode').value.trim();
      it.kat = form.querySelector('.adm-kat').value.trim();
      it.bulan = Number(form.querySelector('.adm-bulan').value);
      it.point = form.querySelector('.adm-point').value.trim();
      it.final = form.querySelector('.adm-final').checked;
      await saveDepts();
      state.adminEditingNo = null;
      renderAdmin();
      showToast('Poin diperbarui');
    });
  });

  document.querySelectorAll('[data-delno]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.adminConfirmDeleteNo = Number(b.dataset.delno); renderAdmin(); });
  });
  document.querySelectorAll('[data-canceldelno]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.adminConfirmDeleteNo = null; renderAdmin(); });
  });
  document.querySelectorAll('[data-confirmdelno]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const no = Number(b.dataset.confirmdelno);
      const dept = state.depts[deptKey];
      dept.items = dept.items.filter(x=>x.no!==no);
      await saveDepts();
      state.adminConfirmDeleteNo = null;
      renderAdmin();
      showToast('Poin dihapus');
    });
  });

  document.querySelectorAll('[data-addbulan]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.adminAdding = Number(b.dataset.addbulan); state.adminEditingNo=null; renderAdmin(); });
  });
  document.querySelectorAll('[data-canceladdbulan]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.adminAdding = false; renderAdmin(); });
  });
  document.querySelectorAll('[data-saveaddbulan]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const bulan = Number(b.dataset.saveaddbulan);
      const form = b.closest('.tt-admin-edit-form');
      const point = form.querySelector('.add-point').value.trim();
      if(!point){ showToast('Poin wajib diisi'); return; }
      const kode = form.querySelector('.add-kode').value.trim() || '-';
      const kat = form.querySelector('.add-kat').value.trim() || '-';
      const final = form.querySelector('.add-final').checked;
      const dept = state.depts[deptKey];
      const newNo = dept.nextNo || (dept.items.reduce((m,it)=>Math.max(m,it.no),0)+1);
      dept.items.push({ no:newNo, bulan, kode, kat, point, final });
      dept.nextNo = newNo + 1;
      await saveDepts();
      state.adminAdding = false;
      renderAdmin();
      showToast('Poin ditambahkan');
    });
  });
}

// ---------- INIT ----------
loadAll();

})();
</script>
